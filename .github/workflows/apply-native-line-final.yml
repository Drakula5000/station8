name: Apply final native Connector fix

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-line-connector-canvas-office-drop
          fetch-depth: 0

      - name: Route Station document files before tldraw validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/TldrawCanvas.jsx')
          text = path.read_text()

          ref_anchor = "  const onSaveStateRef = useRef(onSaveState)\n"
          ref_replacement = ref_anchor + "  const onExternalFilesDropRef = useRef(onExternalFilesDrop)\n"
          if 'const onExternalFilesDropRef = useRef' not in text:
              if ref_anchor not in text:
                  raise SystemExit('external-file callback ref anchor missing')
              text = text.replace(ref_anchor, ref_replacement, 1)

          effect_old = "    onSaveStateRef.current = onSaveState\n  }, [boardId, readOnly, viewerMode, onSaveState])"
          effect_new = "    onSaveStateRef.current = onSaveState\n    onExternalFilesDropRef.current = onExternalFilesDrop\n  }, [boardId, readOnly, viewerMode, onSaveState, onExternalFilesDrop])"
          if effect_old in text:
              text = text.replace(effect_old, effect_new, 1)
          elif effect_new not in text:
              raise SystemExit('external-file callback ref sync anchor missing')

          handler_old = """      const mediaFiles = files.filter((file) => file.type.startsWith('image/') || file.type.startsWith('video/'))
      const otherFiles = files.filter((file) => !file.type.startsWith('image/') && !file.type.startsWith('video/'))

      if (mediaFiles.length && defaultFilesHandler) {
        const originalZoomToSelection = editor.zoomToSelection
        editor.zoomToSelection = () => editor
        try {
          await defaultFilesHandler({ ...externalContent, files: mediaFiles, point })
        } finally {
          editor.zoomToSelection = originalZoomToSelection
        }
      }

      if (otherFiles.length && defaultFilesHandler) {
        await defaultFilesHandler({ ...externalContent, files: otherFiles })
      }
"""
          handler_new = """      const stationFiles = files.filter(file => /\\.(?:pdf|docx|pptx)$/i.test(String(file?.name || '')))
      const mediaFiles = files.filter((file) => file.type.startsWith('image/') || file.type.startsWith('video/'))
      const otherFiles = files.filter((file) => (
        !stationFiles.includes(file)
        && !file.type.startsWith('image/')
        && !file.type.startsWith('video/')
      ))

      // Route Station document types through Station 8 itself. They must not
      // reach tldraw's default file validator, which rejects DOCX/PPTX/PDF and
      // produces the misleading "File type is not allowed" toast.
      if (stationFiles.length && !readOnlyRef.current && typeof onExternalFilesDropRef.current === 'function') {
        await onExternalFilesDropRef.current(stationFiles)
      }

      if (mediaFiles.length && defaultFilesHandler) {
        const originalZoomToSelection = editor.zoomToSelection
        editor.zoomToSelection = () => editor
        try {
          await defaultFilesHandler({ ...externalContent, files: mediaFiles, point })
        } finally {
          editor.zoomToSelection = originalZoomToSelection
        }
      }

      if (otherFiles.length && defaultFilesHandler) {
        await defaultFilesHandler({ ...externalContent, files: otherFiles })
      }
"""
          if handler_old in text:
              text = text.replace(handler_old, handler_new, 1)
          elif 'const stationFiles = files.filter' not in text:
              raise SystemExit('registered tldraw file-handler anchor missing')

          capture_start = text.find('  const handleDocumentDropCapture = useCallback((event) => {')
          if capture_start >= 0:
              capture_end = text.find('\n  const ghostPx = ghost && editorRef.current', capture_start)
              if capture_end < 0:
                  raise SystemExit('DOM capture cleanup anchor missing')
              text = text[:capture_start] + text[capture_end + 1:]
          text = text.replace('      onDropCapture={handleDocumentDropCapture}\n', '')

          path.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Commit verified feature
        shell: bash
        run: |
          rm -f .github/workflows/native-line-connector-canvas-drop-fix.yml
          rm -f _trigger_native_line_fix*.txt
          git config user.name "Station 8 Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Feature already final."
            exit 0
          fi
          git commit -m "fix: intercept Station documents in tldraw file pipeline"
          git push origin HEAD:fix/native-line-connector-canvas-office-drop

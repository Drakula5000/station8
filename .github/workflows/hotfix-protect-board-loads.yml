name: Hotfix protect board loads

on:
  pull_request:
    branches: [main]
    paths:
      - frontend/src/TldrawCanvas.jsx
      - frontend/src/canvas/StationArrowShapeUtil.jsx
      - frontend/src/canvas/StationArrowShapeUtil.test.js
      - .github/workflows/hotfix-protect-board-loads.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Revert connector override and guard failed loads
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/TldrawCanvas.jsx')
          text = path.read_text()

          text = text.replace("import { StationArrowShapeUtil } from './canvas/StationArrowShapeUtil'\n", "", 1)
          text = text.replace("const STATION_SHAPE_UTILS = [\n  StationArrowShapeUtil,\n  StationFrameShapeUtil,", "const STATION_SHAPE_UTILS = [\n  StationFrameShapeUtil,", 1)

          old_save = """  const doSave = useCallback(async () => {\n    const editor = editorRef.current\n    if (!editor || readOnlyRef.current) return\n"""
          new_save = """  const doSave = useCallback(async () => {\n    const editor = editorRef.current\n    // Never persist the editor while a board load is still in progress or has\n    // failed. A failed fetch / snapshot migration must not be able to turn the\n    // temporary blank editor into the board's durable snapshot.\n    if (!editor || readOnlyRef.current || loadingRef.current) return\n"""
          if old_save not in text:
              raise SystemExit('doSave guard anchor not found')
          text = text.replace(old_save, new_save, 1)

          old_load = """    fetch(url, { credentials: 'include' })\n      .then(r => r.ok ? r.json() : null)\n      .then(data => {\n        if (data?.asset_urls) setSignedUploadUrls(data.asset_urls)\n        if (data?.snapshot?.store) {\n          editor.store.loadStoreSnapshot(data.snapshot)\n        }\n      })\n      .catch(err => {\n        console.error('board load failed', err)\n      })\n      .finally(() => {\n        loadingRef.current = false\n"""
          new_load = """    let loadSucceeded = false\n    fetch(url, { credentials: 'include' })\n      .then(async (response) => {\n        if (!response.ok) throw new Error(`board load failed (${response.status})`)\n        return response.json()\n      })\n      .then(data => {\n        if (!data || typeof data !== 'object') throw new Error('invalid board payload')\n        if (data.asset_urls) setSignedUploadUrls(data.asset_urls)\n        if (data.snapshot?.store) {\n          editor.store.loadStoreSnapshot(data.snapshot)\n        }\n        loadSucceeded = true\n      })\n      .catch(err => {\n        // Keep loadingRef true and lock the temporary blank editor. The save\n        // listener and doSave both refuse writes while loadingRef is true.\n        console.error('board load failed', err)\n        editor.updateInstanceState({ isReadonly: true })\n        onSaveStateRef.current?.('error')\n      })\n      .finally(() => {\n        if (!loadSucceeded) return\n        loadingRef.current = false\n"""
          if old_load not in text:
              raise SystemExit('board load chain anchor not found')
          text = text.replace(old_load, new_load, 1)
          path.write_text(text)
          PY

          rm -f frontend/src/canvas/StationArrowShapeUtil.jsx frontend/src/canvas/StationArrowShapeUtil.test.js

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Unit tests
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Verify safety invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('frontend/src/TldrawCanvas.jsx').read_text()
          assert 'StationArrowShapeUtil' not in text
          assert 'loadingRef.current ||' in text
          assert 'let loadSucceeded = false' in text
          assert 'if (!loadSucceeded) return' in text
          assert "editor.updateInstanceState({ isReadonly: true })" in text
          PY

      - name: Commit verified hotfix
        shell: bash
        run: |
          rm .github/workflows/hotfix-protect-board-loads.yml
          git config user.name "Station 8 Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(canvas): never save a failed board load"
          git push origin HEAD:${{ github.head_ref }}

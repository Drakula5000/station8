name: Repair Office multipart PR

on:
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/office-drop-and-connector-ux
          fetch-depth: 0

      - name: Apply final source repair
        run: python .github/scripts/finalize_office_connector.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: pip install -r requirements.txt
      - name: Backend import check
        env:
          FLASK_SECRET_KEY: ci-dummy
        run: python -c "import server"
      - name: Backend tests
        env:
          FLASK_SECRET_KEY: ci-dummy
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit verified repair
        run: |
          rm -f .github/workflows/repair-office-multipart-pr.yml
          rm -f .github/workflows/finalize-office-connector-pr.yml
          rm -f .github/workflows/finalize-office-connector-feature.yml
          rm -f .github/workflows/agent-office-connector-patch.yml
          rm -f .github/scripts/finalize_office_connector.py
          rm -f .github/workflows/apply-office-drop-connector-ux.yml
          rm -f .github/workflows/run-staged-office-patch.yml
          rm -f _agent_trigger*.txt
          git config user.name "Station 8 Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize Office imports and connector UX"
          git push origin HEAD:fix/office-drop-and-connector-ux

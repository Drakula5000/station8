name: Repair Office multipart PR

on:
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/office-drop-and-connector-ux
          fetch-depth: 0

      - name: Execute repair source step
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          raw = Path('.github/workflows/repair-office-multipart.yml').read_text()
          start = "      - name: Repair multipart wire format and add regression\n        run: |\n"
          end = "\n      - uses: actions/setup-python@v5"
          if start not in raw or end not in raw:
              raise SystemExit('repair workflow source anchors missing')
          script = textwrap.dedent(raw.split(start, 1)[1].split(end, 1)[0])
          Path('/tmp/station8-office-repair.sh').write_text(script)
          PY
          bash /tmp/station8-office-repair.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backend tests
        env:
          FLASK_SECRET_KEY: ci-dummy
        run: python -m unittest discover -s tests -p 'test_*.py'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      - name: Commit verified repair
        run: |
          rm -f .github/workflows/repair-office-multipart.yml .github/workflows/repair-office-multipart-pr.yml
          rm -f _agent_trigger*.txt
          git config user.name "Station 8 Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: emit valid Drive multipart Office imports"
          git push origin HEAD:fix/office-drop-and-connector-ux

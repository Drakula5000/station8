name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt into Node 24 for all JS-based actions ahead of GitHub's June 2026
# default switch (Node 20 deprecated). Removable once every action we use
# ships a Node-24-native version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  frontend:
    name: Frontend test + build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: pip install -r requirements.txt
      - name: Import check
        env:
          FLASK_SECRET_KEY: ci-dummy
        run: python -c "import server"
      - name: Unit tests
        env:
          FLASK_SECRET_KEY: ci-dummy
        run: python -m unittest discover -s tests -p 'test_*.py'

  materialize-office-connector-feature:
    name: Materialize Office + Connector source
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/office-drop-and-connector-ux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/office-drop-and-connector-ux
          fetch-depth: 0
      - name: Apply staged source patch
        shell: bash
        run: |
          if [ ! -f .github/workflows/apply-office-drop-connector-ux.yml ]; then
            echo "Feature source already materialized."
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path
          import textwrap

          raw = Path('.github/workflows/apply-office-drop-connector-ux.yml').read_text()
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          if start not in raw or end not in raw:
              raise SystemExit('could not locate staged source patch')
          body = raw.split(start, 1)[1].split(end, 1)[0]
          exec(compile(textwrap.dedent(body), 'office-connector-feature-patch', 'exec'), {})
          PY

          # The staged generator escaped one Python docstring delimiter. Fix
          # that generated source before committing; normal CI validates the
          # resulting source on the next PR synchronization.
          python - <<'PY'
          from pathlib import Path
          path = Path('server.py')
          text = path.read_text()
          broken = r'    \"\"\"Upload an OOXML file and ask Drive to convert it to a Google-native type.\"\"\"'
          fixed = '    """Upload an OOXML file and ask Drive to convert it to a Google-native type."""'
          if broken not in text:
              raise SystemExit('expected generated Office docstring anchor missing')
          path.write_text(text.replace(broken, fixed, 1))
          PY

          rm -f .github/workflows/apply-office-drop-connector-ux.yml
          rm -f .github/workflows/run-staged-office-patch.yml
          rm -f .github/workflows/agent-office-connector-patch.yml
          rm -f _agent_trigger*.txt

          git config user.name "Station 8 Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: import Office drops and finish multipoint connectors"
          git push origin HEAD:fix/office-drop-and-connector-ux

name: Run sidebar folder persistence fix

on:
  pull_request:
    branches: [main]
    paths:
      - frontend/src/sidebarFolderState.js
      - frontend/src/sidebarFolderState.test.js
      - ops/apply_sidebar_folder_persistence.py
      - .github/workflows/apply-sidebar-folder-persistence.yml
      - .github/workflows/run-sidebar-folder-persistence-on-pr.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply App changes
        run: python ops/apply_sidebar_folder_persistence.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Unit tests
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Commit verified fix
        shell: bash
        run: |
          rm .github/workflows/apply-sidebar-folder-persistence.yml
          rm .github/workflows/run-sidebar-folder-persistence-on-pr.yml
          rm ops/apply_sidebar_folder_persistence.py
          git config user.name "Station 8 Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/App.jsx frontend/src/sidebarFolderState.js frontend/src/sidebarFolderState.test.js .github/workflows ops
          git commit -m "fix: persist sidebar folder expansion state"
          git push origin HEAD:${{ github.head_ref }}

    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/office-drop-and-connector-ux
          fetch-depth: 0

      - name: Repair feature source if needed
        shell: bash

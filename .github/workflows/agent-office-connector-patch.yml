name: Agent Office Connector Patch

on:
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/office-drop-and-connector-ux'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/office-drop-and-connector-ux
          fetch-depth: 0

      - name: Check for staged patch
        id: staged
        shell: bash
        run: |
          if [ -f .github/workflows/apply-office-drop-connector-ux.yml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute staged patch
        if: steps.staged.outputs.present == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          raw = Path('.github/workflows/apply-office-drop-connector-ux.yml').read_text()
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          if start not in raw or end not in raw:
              raise SystemExit('could not locate staged patch body')
          body = raw.split(start, 1)[1].split(end, 1)[0]
          exec(compile(textwrap.dedent(body), 'staged-office-connector-patch', 'exec'), {})
          PY

      - uses: actions/setup-node@v4
        if: steps.staged.outputs.present == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        if: steps.staged.outputs.present == 'true'
        with:
          python-version: '3.11'
          cache: pip
      - if: steps.staged.outputs.present == 'true'
        run: npm ci
        working-directory: frontend
      - if: steps.staged.outputs.present == 'true'
        run: npm run lint
        working-directory: frontend
      - if: steps.staged.outputs.present == 'true'
        run: npm test
        working-directory: frontend
      - if: steps.staged.outputs.present == 'true'
        run: npm run build
        working-directory: frontend
      - if: steps.staged.outputs.present == 'true'
        run: pip install -r requirements.txt
      - if: steps.staged.outputs.present == 'true'
        env:
          FLASK_SECRET_KEY: ci-dummy
        run: python -c "import server"
      - if: steps.staged.outputs.present == 'true'
        env:
          FLASK_SECRET_KEY: ci-dummy
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit verified implementation to branch
        if: steps.staged.outputs.present == 'true'
        run: |
          rm -f .github/workflows/apply-office-drop-connector-ux.yml .github/workflows/run-staged-office-patch.yml
          rm -f _agent_trigger*.txt
          git config user.name "Station 8 Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Office drops and finish multipoint connectors"
          git push origin HEAD:fix/office-drop-and-connector-ux

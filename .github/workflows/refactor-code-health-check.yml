name: Code health refactor check

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  apply-and-verify:
    if: github.head_ref == 'refactor/code-health'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/code-health
          fetch-depth: 0
      - name: Detect completed refactor
        id: state
        run: |
          if [ -f .code-health-applied ]; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.state.outputs.applied != 'true'
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        if: steps.state.outputs.applied != 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply refactor
        if: steps.state.outputs.applied != 'true'
        run: python ops/refactor_code_health.py
      - name: Finish generated frontend wiring
        if: steps.state.outputs.applied != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('frontend/src/App.jsx')
          text = app.read_text()
          text = text.replace(
              "import { API, fetchJson, fetchJsonPatch, fetchJsonPost } from './api'",
              "import { API, JSON_HEADERS, fetchJson, fetchJsonPatch, fetchJsonPost } from './api'",
              1,
          )
          text = text.replace(
              "import { DOC_KIND_API, DOC_KIND_LABEL, DOC_KIND_ORDER, DOC_KINDS, ROOT_FOLDER } from './documentKinds'",
              "import { DOC_KIND_API, DOC_KIND_CONFIG, DOC_KIND_LABEL, DOC_KIND_ORDER, DOC_KINDS, ROOT_FOLDER, docTypeLabel } from './documentKinds'",
              1,
          )
          app.write_text(text)

          package = Path('frontend/package.json')
          package.write_text(package.read_text().replace(
              '"test": "node --test"',
              '"test": "node --test --test-force-exit"',
              1,
          ))

          modal = Path('frontend/src/styles/modal.css')
          modal.write_text(modal.read_text().rstrip() + '\n')
          PY
      - name: Patch hygiene
        if: steps.state.outputs.applied != 'true'
        run: git diff --check
      - name: Backend verification
        if: steps.state.outputs.applied != 'true'
        env:
          FLASK_SECRET_KEY: ci-dummy
        run: |
          pip install -r requirements.txt
          python -c "import server"
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Frontend verification
        if: steps.state.outputs.applied != 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit verified product refactor
        if: steps.state.outputs.applied != 'true'
        run: |
          touch .code-health-applied
          git checkout HEAD -- .github/workflows
          git config user.name "Station 8 Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: consolidate Station 8 code health"
          git push origin HEAD:refactor/code-health

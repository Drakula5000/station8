name: One-shot code health refactor

on:
  push:
    branches: [refactor/code-health]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[code-health-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/code-health
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply behavior-preserving refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text)

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label}: expected anchor not found')
              return text.replace(old, new, 1)

          # 1. Remove emergency repair machinery and stale trigger artifacts.
          for rel in [
              '.github/workflows/apply-native-line-final.yml',
              '.github/workflows/run-native-line-feature-fix.yml',
              '_trigger_apply_native_line_final.txt',
          ]:
              Path(rel).unlink(missing_ok=True)
          for p in root.glob('_trigger*'):
              if 'native' in p.name.lower() or 'connector' in p.name.lower():
                  p.unlink(missing_ok=True)

          # 2. Pin the frontend runtime to the CI/production major we actually test.
          package_path = Path('frontend/package.json')
          package = json.loads(package_path.read_text())
          package.setdefault('engines', {})['node'] = '24.x'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          # 3. Centralize frontend API behavior.
          write('frontend/src/api.js', """export const API = import.meta.env?.VITE_API_URL || ''

export const JSON_HEADERS = { 'Content-Type': 'application/json' }

export async function readApiError(response, fallback) {
  const body = await response.json().catch(() => null)
  return body?.error || body?.message || fallback
}

export async function fetchJson(url, options = {}, fallback = null) {
  try {
    const res = await fetch(url, { credentials: 'include', ...options })
    if (!res.ok) return fallback
    return await res.json()
  } catch {
    return fallback
  }
}

export function fetchJsonPost(url, payload, fallback = null) {
  return fetchJson(url, { method: 'POST', headers: JSON_HEADERS, body: JSON.stringify(payload) }, fallback)
}

export function fetchJsonPatch(url, payload, fallback = null) {
  return fetchJson(url, { method: 'PATCH', headers: JSON_HEADERS, body: JSON.stringify(payload) }, fallback)
}
""")

          # 4. Centralize document-kind metadata.
          write('frontend/src/documentKinds.js', """export const ROOT_FOLDER = '__root__'

export const DOC_KIND_CONFIG = {
  board: { api: 'boards', label: 'Board', order: 0 },
  gdoc: { api: 'gdocs', label: 'Doc', order: 1 },
  gsheet: { api: 'gsheets', label: 'Sheet', order: 2 },
  gslide: { api: 'gslides', label: 'Slides', order: 3 },
  report: { api: 'reports', label: 'Report', order: 4 },
  pdf: { api: 'pdfs', label: 'PDF', order: 5 },
}

export const DOC_KINDS = Object.keys(DOC_KIND_CONFIG)
export const DOC_KIND_API = Object.fromEntries(DOC_KINDS.map(kind => [kind, DOC_KIND_CONFIG[kind].api]))
export const DOC_KIND_LABEL = Object.fromEntries(DOC_KINDS.map(kind => [kind, DOC_KIND_CONFIG[kind].label]))
export const DOC_KIND_ORDER = Object.fromEntries(DOC_KINDS.map(kind => [kind, DOC_KIND_CONFIG[kind].order]))

export function docTypeLabel(type) {
  return DOC_KIND_LABEL[type] || 'Item'
}
""")

          # 5. Replace the DOM MutationObserver toast hack with a real React component.
          write('frontend/src/components/DismissibleNotice.jsx', """import { useState } from 'react'

export function DismissibleNotice({ className = '', children, ...props }) {
  const [dismissed, setDismissed] = useState(false)
  if (dismissed) return null
  return (
    <div className={`${className} station-notice`.trim()} {...props}>
      {children}
      <button
        className="station-notice-dismiss"
        type="button"
        aria-label="Dismiss notice"
        title="Dismiss"
        onClick={() => setDismissed(true)}
      >×</button>
    </div>
  )
}
""")

          main_path = Path('frontend/src/main.jsx')
          main = main_path.read_text()
          notice_start = main.find("// Station's import/error notices")
          if notice_start >= 0:
              notice_end = main.find('createRoot(', notice_start)
              if notice_end < 0:
                  raise SystemExit('main.jsx: createRoot anchor missing after notice enhancer')
              main = main[:notice_start] + main[notice_end:]
          main_path.write_text(main)

          modal_path = Path('frontend/src/styles/modal.css')
          modal = modal_path.read_text()
          notice_css = """

/* Dismissible status/error notices. Dismissal hides presentation only; the
   underlying import/OCR promise continues independently in App state. */
.station-notice { padding-right: 2.35rem !important; }
.station-notice-dismiss {
  position: absolute;
  right: 0.55rem;
  top: 50%;
  transform: translateY(-50%);
  width: 1.35rem;
  height: 1.35rem;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 0.25rem;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 1rem;
  line-height: 1;
  cursor: pointer;
  opacity: 0.8;
}
.station-notice-dismiss:hover { opacity: 1; }
"""
          if '.station-notice-dismiss' not in modal:
              modal_path.write_text(modal.rstrip() + notice_css + '\n')

          # 6. Give Station file drops one routing pipeline.
          write('frontend/src/fileDropRouting.js', """import { classifyDroppedFile } from './officeImport.js'

export function partitionDroppedFiles(files) {
  const stationFiles = []
  const mediaFiles = []
  const otherFiles = []

  for (const file of Array.from(files || [])) {
    const classification = classifyDroppedFile(file)
    if (classification.type === 'pdf' || classification.type === 'office') {
      stationFiles.push(file)
    } else if (String(file?.type || '').startsWith('image/') || String(file?.type || '').startsWith('video/')) {
      mediaFiles.push(file)
    } else {
      otherFiles.push(file)
    }
  }

  return { stationFiles, mediaFiles, otherFiles }
}
""")

          # 7. Split canvas export logic out of TldrawCanvas.
          write('frontend/src/canvas/exporting.js', """import { getSvgAsImage } from 'tldraw'
import { patchSvgExports, hasCustomFill } from './magicFill'

function exportTimestamp() {
  const now = new Date()
  const y = String(now.getFullYear()).slice(2)
  const m = String(now.getMonth() + 1).padStart(2, '0')
  const d = String(now.getDate()).padStart(2, '0')
  const hh = String(now.getHours()).padStart(2, '0')
  const mm = String(now.getMinutes()).padStart(2, '0')
  const ss = String(now.getSeconds()).padStart(2, '0')
  return `${y}-${m}-${d} ${hh}.${mm}.${ss}`
}

function exportName(editor, ids, format) {
  if (ids.length === 1) {
    const first = editor.getShape(ids[0])
    if (first && editor.isShapeOfType(first, 'frame')) {
      return `${first.props.name || 'frame'}.${format}`
    }
  }
  return `shapes at ${exportTimestamp()}.${format}`
}

function getExportOpts(editor) {
  return {
    background: editor.getInstanceState().exportBackground,
    darkMode: editor.user.getIsDarkMode(),
  }
}

async function getExportBlob(editor, ids, format) {
  const opts = { format, ...getExportOpts(editor) }
  const needsPatch = ids.some(id => hasCustomFill(editor.getShape(id)))
  if (!needsPatch) {
    const { blob } = await editor.toImage(ids, opts)
    return blob
  }
  const { svg, width, height } = await editor.getSvgString(ids, opts)
  const patched = patchSvgExports(svg, editor, ids, opts.darkMode)
  if (format === 'svg') {
    return new Blob([patched], { type: 'image/svg+xml' })
  }
  return await getSvgAsImage(patched, { type: format, width, height, pixelRatio: 2 })
}

export async function downloadExport(editor, ids, format) {
  if (ids.length === 0) return
  const blob = await getExportBlob(editor, ids, format)
  if (!blob) return
  const link = document.createElement('a')
  link.href = URL.createObjectURL(blob)
  link.download = exportName(editor, ids, format)
  link.click()
  URL.revokeObjectURL(link.href)
}

export async function copyExport(editor, ids, format) {
  if (ids.length === 0) return
  const blob = await getExportBlob(editor, ids, format)
  if (!blob) return
  if (format === 'svg') {
    await navigator.clipboard.writeText(await blob.text())
  } else {
    await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })])
  }
}
""")

          canvas_path = Path('frontend/src/TldrawCanvas.jsx')
          canvas = canvas_path.read_text()
          canvas = canvas.replace("import { Tldraw, createShapeId, getArrowInfo, getSvgAsImage } from 'tldraw'", "import { Tldraw, createShapeId, getArrowInfo } from 'tldraw'")
          canvas = canvas.replace("import { patchSvgExports, hasCustomFill } from './canvas/magicFill'\n", '')
          if "import { API } from './api'" not in canvas:
              canvas = canvas.replace("import { useCanvasCamera } from './canvas/useCanvasCamera'\n", "import { useCanvasCamera } from './canvas/useCanvasCamera'\nimport { API } from './api'\nimport { partitionDroppedFiles } from './fileDropRouting'\nimport { copyExport, downloadExport } from './canvas/exporting'\n")
          canvas = canvas.replace("\nconst API = import.meta.env.VITE_API_URL || ''\n", '\n')

          export_start = canvas.find('function exportTimestamp() {')
          export_end = canvas.find('const TLDRAW_UI_OVERRIDES = {', export_start)
          if export_start >= 0 and export_end > export_start:
              canvas = canvas[:export_start] + canvas[export_end:]

          ref_anchor = "  const onSaveStateRef = useRef(onSaveState)\n"
          if 'const onExternalFilesDropRef = useRef' not in canvas:
              canvas = replace_once(canvas, ref_anchor, ref_anchor + "  const onExternalFilesDropRef = useRef(onExternalFilesDrop)\n", 'canvas external drop ref')

          effect_old = "    onSaveStateRef.current = onSaveState\n  }, [boardId, readOnly, viewerMode, onSaveState])"
          effect_new = "    onSaveStateRef.current = onSaveState\n    onExternalFilesDropRef.current = onExternalFilesDrop\n  }, [boardId, readOnly, viewerMode, onSaveState, onExternalFilesDrop])"
          if effect_old in canvas:
              canvas = canvas.replace(effect_old, effect_new, 1)
          elif effect_new not in canvas:
              raise SystemExit('canvas external drop ref synchronization anchor missing')

          old_handler = """      const mediaFiles = files.filter((file) => file.type.startsWith('image/') || file.type.startsWith('video/'))
      const otherFiles = files.filter((file) => !file.type.startsWith('image/') && !file.type.startsWith('video/'))

      if (mediaFiles.length && defaultFilesHandler) {
        const originalZoomToSelection = editor.zoomToSelection
        editor.zoomToSelection = () => editor
        try {
          await defaultFilesHandler({ ...externalContent, files: mediaFiles, point })
        } finally {
          editor.zoomToSelection = originalZoomToSelection
        }
      }

      if (otherFiles.length && defaultFilesHandler) {
        await defaultFilesHandler({ ...externalContent, files: otherFiles })
      }
"""
          new_handler = """      const { stationFiles, mediaFiles, otherFiles } = partitionDroppedFiles(files)

      if (stationFiles.length && !readOnlyRef.current && typeof onExternalFilesDropRef.current === 'function') {
        await onExternalFilesDropRef.current(stationFiles)
      }

      if (mediaFiles.length && defaultFilesHandler) {
        const originalZoomToSelection = editor.zoomToSelection
        editor.zoomToSelection = () => editor
        try {
          await defaultFilesHandler({ ...externalContent, files: mediaFiles, point })
        } finally {
          editor.zoomToSelection = originalZoomToSelection
        }
      }

      if (otherFiles.length && defaultFilesHandler) {
        await defaultFilesHandler({ ...externalContent, files: otherFiles })
      }
"""
          canvas = replace_once(canvas, old_handler, new_handler, 'canvas file pipeline')

          capture_start = canvas.find('  const handleDocumentDropCapture = useCallback((event) => {')
          if capture_start >= 0:
              capture_end = canvas.find('\n  const ghostPx = ghost && editorRef.current', capture_start)
              if capture_end < 0:
                  raise SystemExit('canvas drop-capture end anchor missing')
              canvas = canvas[:capture_start] + canvas[capture_end + 1:]
          canvas = canvas.replace('      onDropCapture={handleDocumentDropCapture}\n', '')
          canvas_path.write_text(canvas)

          # 8. App: use shared API/document metadata and React notices.
          app_path = Path('frontend/src/App.jsx')
          app = app_path.read_text()
          if "import { DismissibleNotice } from './components/DismissibleNotice'" not in app:
              app = app.replace("import PdfUploadPanel from './components/PdfUploadPanel'\n", "import PdfUploadPanel from './components/PdfUploadPanel'\nimport { DismissibleNotice } from './components/DismissibleNotice'\n")
          if "from './api'" not in app:
              app = app.replace("import { classifyDroppedFile, importOfficeFile } from './officeImport'\n", "import { classifyDroppedFile, importOfficeFile } from './officeImport'\nimport { API, JSON_HEADERS, fetchJson, fetchJsonPatch, fetchJsonPost } from './api'\nimport { DOC_KIND_API, DOC_KIND_CONFIG, DOC_KIND_LABEL, DOC_KIND_ORDER, DOC_KINDS, ROOT_FOLDER, docTypeLabel } from './documentKinds'\n")
          app = app.replace("\nconst API = import.meta.env.VITE_API_URL || ''\n", '\n')
          app = app.replace("const ROOT_FOLDER = '__root__'\n", '')

          config_start = app.find('// One registry drives every document-kind seam:')
          config_end = app.find('const compareByName', config_start)
          if config_start >= 0 and config_end > config_start:
              app = app[:config_start] + app[config_end:]
          app = app.replace("const DOC_KIND_ORDER = Object.fromEntries(DOC_KINDS.map(kind => [kind, DOC_KIND_CONFIG[kind].order]))\n\n", '')

          local_doc_label = """function docTypeLabel(type) {
  return DOC_KIND_LABEL[type] || 'Item'
}

"""
          app = app.replace(local_doc_label, '')

          fetch_start = app.find('async function fetchJson(url, options = {}, fallback = null) {')
          fetch_end = app.find('function clearStorageByPrefix', fetch_start)
          if fetch_start >= 0 and fetch_end > fetch_start:
              app = app[:fetch_start] + app[fetch_end:]

          app = replace_once(app,
              """      {errorVisible && errorMessage && (
        <div className="error-toast">{errorMessage}</div>
      )}
""",
              """      {errorVisible && errorMessage && (
        <DismissibleNotice className="error-toast">{errorMessage}</DismissibleNotice>
      )}
""",
              'error notice')
          app = replace_once(app,
              """      {pdfDropBusy && (
        <div className="pdf-drop-progress-toast" role="status">
""",
              """      {pdfDropBusy && (
        <DismissibleNotice className="pdf-drop-progress-toast" role="status">
""",
              'drop progress notice open')
          # The first closing div after the Stop block belongs to this notice.
          progress_marker = """          )}
        </div>
      )}
      {pdfReindexProgress && (
        <div className="pdf-drop-progress-toast" role="status">
"""
          progress_replacement = """          )}
        </DismissibleNotice>
      )}
      {pdfReindexProgress && (
        <DismissibleNotice className="pdf-drop-progress-toast" role="status">
"""
          app = replace_once(app, progress_marker, progress_replacement, 'drop/reindex notice boundary')
          reindex_marker = """          {pdfReindexProgress.name || 'PDF'} · {pdfProgressLabel(pdfReindexProgress, { includeQueue: false })}
        </div>
      )}
"""
          reindex_replacement = """          {pdfReindexProgress.name || 'PDF'} · {pdfProgressLabel(pdfReindexProgress, { includeQueue: false })}
        </DismissibleNotice>
      )}
"""
          app = replace_once(app, reindex_marker, reindex_replacement, 'reindex notice close')

          # Extract the self-contained access gate and Google embed components.
          access_start = app.find('function AccessGate({')
          access_end = app.find('function AccessProfilesModal({', access_start)
          if access_start >= 0 and access_end > access_start:
              access_block = app[access_start:access_end]
              access_block = access_block.replace('function AccessGate({', 'export function AccessGate({', 1)
              write('frontend/src/components/AccessGate.jsx', "import { docTypeLabel } from '../documentKinds'\n\n" + access_block)
              app = app[:access_start] + app[access_end:]
              if "import { AccessGate } from './components/AccessGate'" not in app:
                  app = app.replace("import { DismissibleNotice } from './components/DismissibleNotice'\n", "import { DismissibleNotice } from './components/DismissibleNotice'\nimport { AccessGate } from './components/AccessGate'\n")

          google_start = app.find('function GoogleEmbed({')
          if google_start >= 0:
              google_block = app[google_start:]
              if 'function GDriveUrlField({' not in google_block:
                  raise SystemExit('GoogleEmbed extraction found no GDriveUrlField')
              google_block = google_block.replace('function GoogleEmbed({', 'export function GoogleEmbed({', 1)
              google_block = google_block.replace('function GDriveUrlField({', 'export function GDriveUrlField({', 1)
              write('frontend/src/components/GoogleEmbed.jsx', "import { GoogleLogoIcon } from '../icons'\n\n" + google_block.rstrip() + '\n')
              app = app[:google_start].rstrip() + '\n'
              if "from './components/GoogleEmbed'" not in app:
                  app = app.replace("import { AccessGate } from './components/AccessGate'\n", "import { AccessGate } from './components/AccessGate'\nimport { GDriveUrlField, GoogleEmbed } from './components/GoogleEmbed'\n")

          app_path.write_text(app)

          # 9. API imports in feature modules.
          office_path = Path('frontend/src/officeImport.js')
          office = office_path.read_text()
          office = office.replace("const API = import.meta.env?.VITE_API_URL || ''\n\n", "import { API } from './api.js'\n\n", 1)
          office_path.write_text(office)

          pdf_path = Path('frontend/src/pdfUpload.js')
          pdf = pdf_path.read_text()
          if "from './api.js'" not in pdf:
              pdf = pdf.replace("import { extractPdfPages, validatePdfFiles } from './pdf.js'\n\nconst API = import.meta.env?.VITE_API_URL || ''\n", "import { extractPdfPages, validatePdfFiles } from './pdf.js'\nimport { API, readApiError } from './api.js'\n")
          local_error_start = pdf.find('async function readApiError(response, fallback) {')
          if local_error_start >= 0:
              local_error_end = pdf.find('\nexport function pdfProgressLabel', local_error_start)
              if local_error_end < 0:
                  raise SystemExit('pdfUpload readApiError end anchor missing')
              pdf = pdf[:local_error_start] + pdf[local_error_end + 1:]
          pdf_path.write_text(pdf)

          # 10. One JS source of truth for Aurora mappings used by export logic.
          colors_path = Path('frontend/src/colors.js')
          colors = colors_path.read_text()
          if 'AURORA_TL_COLOR_TO_BG' not in colors:
              colors += """

export const AURORA_TL_COLOR_TO_BG = Object.fromEntries(
  AURORA_SWATCHES.map(({ tl, bg }) => [tl, bg])
)
AURORA_TL_COLOR_TO_BG.yellow = AURORA_TL_COLOR_TO_BG['light-violet']
AURORA_TL_COLOR_TO_BG.green = AURORA_TL_COLOR_TO_BG['light-green']
AURORA_TL_COLOR_TO_BG.blue = AURORA_TL_COLOR_TO_BG['light-blue']

export const NOTE_LIGHT_BG_TL_COLORS = new Set([
  'light-violet', 'yellow', 'light-red', 'light-blue', 'blue',
  'light-green', 'green', 'orange', 'white',
])
"""
          colors_path.write_text(colors)

          magic_path = Path('frontend/src/canvas/magicFill.js')
          magic = magic_path.read_text()
          if not magic.startswith('import '):
              magic = "import { AURORA_TL_COLOR_TO_BG, NOTE_LIGHT_BG_TL_COLORS } from '../colors'\n\n" + magic
          map_start = magic.find('// tldraw colour name → Aurora swatch CSS var.')
          map_end = magic.find('// Notes contrast text against the swatch bg', map_start)
          if map_start >= 0 and map_end > map_start:
              magic = magic[:map_start] + """function auroraHex(colorName) {
  const value = AURORA_TL_COLOR_TO_BG[colorName]
  return value ? resolveCssVar(value) : null
}

""" + magic[map_end:]
          set_start = magic.find('const NOTE_LIGHT_BG_COLORS = new Set([')
          if set_start >= 0:
              set_end = magic.find('\n\nfunction noteTextHex', set_start)
              if set_end < 0:
                  raise SystemExit('magicFill light-background set end anchor missing')
              magic = magic[:set_start] + magic[set_end + 2:]
          magic = magic.replace('NOTE_LIGHT_BG_COLORS.has(colorName)', 'NOTE_LIGHT_BG_TL_COLORS.has(colorName)')
          magic_path.write_text(magic)

          # 11. Formalize connector migration while retaining the existing pre-load
          # compatibility adapter, both driven by the same normalizer.
          legacy_path = Path('frontend/src/canvas/legacyConnectorUpgrade.js')
          legacy = legacy_path.read_text()
          legacy = legacy.replace('function normalizeStoredPointMap(points) {', 'export function normalizeStoredPointMap(points) {', 1)
          norm_end_anchor = "  return entries.length >= 2 ? Object.fromEntries(entries) : null\n}\n"
          if 'export function normalizeStoredConnectorProps' not in legacy:
              insert_at = legacy.find(norm_end_anchor)
              if insert_at < 0:
                  raise SystemExit('connector point normalizer anchor missing')
              insert_at += len(norm_end_anchor)
              helper = """

export function normalizeStoredConnectorProps(props = {}) {
  const points = normalizeStoredPointMap(props?.points)
  if (!points) return null
  const rawScale = Number(props?.scale)
  return {
    ...props,
    points,
    spline: props?.spline || 'cubic',
    scale: Number.isFinite(rawScale) ? rawScale : 1,
  }
}
"""
              legacy = legacy[:insert_at] + helper + legacy[insert_at:]

          old_loop = """    const points = normalizeStoredPointMap(record.props?.points)
    if (!points) continue
    const rawScale = Number(record.props?.scale)
    nextStore[key] = {
      ...record,
      props: {
        ...record.props,
        points,
        spline: record.props?.spline || 'cubic',
        scale: Number.isFinite(rawScale) ? rawScale : 1,
      },
    }
"""
          new_loop = """    const props = normalizeStoredConnectorProps(record.props)
    if (!props) continue
    nextStore[key] = {
      ...record,
      props,
    }
"""
          legacy = replace_once(legacy, old_loop, new_loop, 'stored connector migration loop')
          legacy_path.write_text(legacy)

          connector_path = Path('frontend/src/canvas/StationConnectorShapeUtil.jsx')
          connector = connector_path.read_text()
          connector = connector.replace('  getDefaultColorTheme,\n  getIndexBetween,', '  getDefaultColorTheme,\n  createShapePropsMigrationIds,\n  createShapePropsMigrationSequence,\n  getIndexBetween,')
          if "normalizeStoredConnectorProps" not in connector:
              connector = connector.replace("} from 'tldraw'\n\nexport const STATION_CONNECTOR_TYPE", "} from 'tldraw'\nimport { normalizeStoredConnectorProps } from './legacyConnectorUpgrade'\n\nexport const STATION_CONNECTOR_TYPE")
          migration_anchor = "export const STATION_CONNECTOR_TYPE = 's8-connector'\n"
          if 'stationConnectorMigrations' not in connector:
              migration_code = """

const STATION_CONNECTOR_VERSIONS = createShapePropsMigrationIds(STATION_CONNECTOR_TYPE, {
  NormalizeLineProps: 1,
})

export const stationConnectorMigrations = createShapePropsMigrationSequence({
  sequence: [
    {
      id: STATION_CONNECTOR_VERSIONS.NormalizeLineProps,
      up(props) {
        const normalized = normalizeStoredConnectorProps(props)
        if (normalized) Object.assign(props, normalized)
      },
      down(props) {
        const points = Object.values(props?.points || {})
          .sort(sortByIndex)
          .map(point => ({ x: Number(point.x), y: Number(point.y) }))
        if (points.length >= 2) props.points = points
        delete props.spline
        delete props.scale
      },
    },
  ],
})
"""
              connector = connector.replace(migration_anchor, migration_anchor + migration_code, 1)
          connector = connector.replace('  static migrations = undefined', '  static migrations = stationConnectorMigrations')
          connector_path.write_text(connector)

          # 12. Behavioral tests for drop routing and connector normalization.
          write('frontend/src/canvas/documentDropRouting.test.js', """import test from 'node:test'

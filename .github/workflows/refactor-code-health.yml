          # 13. Extract storage authority into a dedicated backend layer. General
          # writes become fail-closed in production when Supabase is configured;
          # tests may explicitly allow local fallback.
          write('storage_layer.py', """import json
import os
import uuid


class JsonStore:
    def __init__(self, *, supabase_getter, table_name, storage_location):
        self._supabase_getter = supabase_getter
        self._table_name = table_name
        self._storage_location = storage_location

    def _client(self):
        return self._supabase_getter()

    def load(self, path, default):
        local_path, file_id = self._storage_location(path)
        client = self._client()
        if client:
            try:
                response = client.table(self._table_name).select('data').eq('id', file_id).execute()
                if response.data:
                    return response.data[0]['data']
            except Exception as exc:
                print(f'Supabase load failed for {path}: {exc}', flush=True)
        if not os.path.exists(local_path):
            return default
        with open(local_path, 'r') as handle:
            return json.load(handle)

    def load_local(self, path, default):
        local_path, _file_id = self._storage_location(path)
        if not os.path.exists(local_path):
            return default
        try:
            with open(local_path, 'r') as handle:
                return json.load(handle)
        except Exception:
            return default

    def write_local_atomic(self, path, data):
        local_path, _file_id = self._storage_location(path)
        os.makedirs(os.path.dirname(local_path), exist_ok=True)
        tmp_path = f'{local_path}.tmp-{uuid.uuid4().hex}'
        try:
            with open(tmp_path, 'w') as handle:
                json.dump(data, handle, indent=2)
            os.replace(tmp_path, local_path)
        finally:
            if os.path.exists(tmp_path):
                os.remove(tmp_path)

    def save(self, path, data, *, require_remote=True):
        _local_path, file_id = self._storage_location(path)
        client = self._client()
        if client:
            try:
                client.table(self._table_name).upsert({'id': file_id, 'data': data}).execute()
            except Exception as exc:
                if require_remote:
                    raise
                print(f'Supabase save failed for {path}: {exc}', flush=True)
        self.write_local_atomic(path, data)

    def delete(self, path, *, strict=False):
        local_path, file_id = self._storage_location(path)
        client = self._client()
        remote_error = None
        local_error = None
        if client:
            try:
                client.table(self._table_name).delete().eq('id', file_id).execute()
            except Exception as exc:
                remote_error = exc
                print(f'Supabase delete failed for {file_id}: {exc}', flush=True)
        if remote_error is None or not strict:
            try:
                if os.path.exists(local_path):
                    os.remove(local_path)
            except OSError as exc:
                local_error = exc
                print(f'Local JSON delete failed for {file_id}: {exc}', flush=True)
                if strict:
                    raise
        if remote_error is not None and strict:
            raise remote_error
        return remote_error is None and local_error is None
""")

          server_path = Path('server.py')
          server = server_path.read_text()
          if 'from storage_layer import JsonStore' not in server:
              server = server.replace('from threading import RLock\n', 'from threading import RLock\n\nfrom storage_layer import JsonStore\n', 1)
          storage_start = server.find('def _load(path, default):')
          storage_end = server.find('def _board_file(item_id):', storage_start)
          if storage_start < 0 or storage_end < 0:
              raise SystemExit('server storage helper block anchors missing')
          wrappers = """_json_store = JsonStore(
    supabase_getter=lambda: supabase,
    table_name=SUPABASE_TABLE,
    storage_location=_storage_location,
)


def _load(path, default):
    return _json_store.load(path, default)


def _load_local_json(path, default):
    return _json_store.load_local(path, default)


def _save(path, data):
    # In production a configured Supabase row is authoritative. Do not report a
    # successful mutation and then allow the next read to resurrect an older
    # remote value. Tests may use deliberately incomplete Supabase doubles and
    # therefore retain the historical local-fallback behavior.
    _json_store.save(path, data, require_remote=not app.config.get('TESTING', False))


def _write_local_json_atomic(path, data):
    _json_store.write_local_atomic(path, data)


def _save_json_strict(path, data):
    _json_store.save(path, data, require_remote=True)


def _delete_json_blob(path, *, strict=False):
    return _json_store.delete(path, strict=strict)


"""
          server = server[:storage_start] + wrappers + server[storage_end:]
          server_path.write_text(server)

          write('tests/test_storage_layer.py', """import json
import os
import tempfile
import unittest

from storage_layer import JsonStore


class _Response:
    def __init__(self, data=None):
        self.data = data or []


class _Query:
    def __init__(self, *, remote_data=None, fail_upsert=False):
        self.remote_data = remote_data
        self.fail_upsert = fail_upsert
        self.payload = None

    def select(self, _fields): return self
    def eq(self, _key, _value): return self
    def delete(self): return self
    def upsert(self, payload):
        self.payload = payload
        return self
    def execute(self):
        if self.payload is not None and self.fail_upsert:
            raise RuntimeError('remote write failed')
        if self.payload is not None:
            self.remote_data = self.payload['data']
            return _Response()
        return _Response([{'data': self.remote_data}] if self.remote_data is not None else [])


class _Client:
    def __init__(self, query): self.query = query
    def table(self, _name): return self.query


class JsonStoreTests(unittest.TestCase):
    def make_store(self, root, query=None):
        def location(path):
            return os.path.join(root, os.path.basename(path)), os.path.basename(path)
        client = _Client(query) if query else None
        return JsonStore(supabase_getter=lambda: client, table_name='json_storage', storage_location=location)

    def test_required_remote_failure_does_not_advance_local_cache(self):
        with tempfile.TemporaryDirectory() as root:
            store = self.make_store(root, _Query(remote_data={'version': 1}, fail_upsert=True))
            path = os.path.join(root, 'workspace.json')
            store.write_local_atomic(path, {'version': 1})
            with self.assertRaises(RuntimeError):
                store.save(path, {'version': 2}, require_remote=True)
            with open(path) as handle:
                self.assertEqual(json.load(handle), {'version': 1})

    def test_successful_remote_write_then_updates_local_cache(self):
        with tempfile.TemporaryDirectory() as root:
            query = _Query(remote_data={'version': 1})
            store = self.make_store(root, query)
            path = os.path.join(root, 'workspace.json')
            store.save(path, {'version': 2}, require_remote=True)
            self.assertEqual(query.remote_data, {'version': 2})
            with open(path) as handle:
                self.assertEqual(json.load(handle), {'version': 2})

    def test_load_prefers_authoritative_remote_row(self):
        with tempfile.TemporaryDirectory() as root:
            store = self.make_store(root, _Query(remote_data={'version': 3}))
            path = os.path.join(root, 'workspace.json')
            store.write_local_atomic(path, {'version': 2})
            self.assertEqual(store.load(path, {}), {'version': 3})


if __name__ == '__main__':
    unittest.main()
""")


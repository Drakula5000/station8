name: Native connector and canvas file-drop fix

on:
  push:
    branches: [fix/native-line-connector-canvas-office-drop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-line-connector-canvas-office-drop
          fetch-depth: 0

      - name: Replace connector with native Line handle system and route canvas document drops
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          shape = r'''/* eslint-disable react-refresh/only-export-components */
          import {
            ArrowShapeArrowheadEndStyle,
            ArrowShapeArrowheadStartStyle,
            LineShapeUtil,
            PathBuilder,
            STROKE_SIZES,
            SVGContainer,
            getColorValue,
            getDefaultColorTheme,
            useDefaultColorTheme,
          } from 'tldraw'

          export const STATION_CONNECTOR_TYPE = 's8-connector'

          function connectorPoints(shape) {
            return Object.values(shape.props.points || {})
              .sort((a, b) => String(a.index).localeCompare(String(b.index)))
              .map(point => ({ x: Number(point.x), y: Number(point.y) }))
          }

          function getConnectorPath(shape) {
            const points = connectorPoints(shape)
            return shape.props.spline === 'line'
              ? PathBuilder.lineThroughPoints(points, { endOffsets: 0 })
              : PathBuilder.cubicSplineThroughPoints(points, { endOffsets: 0 })
          }

          function Arrowhead({ type, point, neighbor, color, strokeWidth }) {
            if (!type || type === 'none' || !point || !neighbor) return null

            const angle = Math.atan2(point.y - neighbor.y, point.x - neighbor.x) * 180 / Math.PI
            const length = Math.max(9, strokeWidth * 4)
            const half = Math.max(4.5, length * 0.42)
            const common = {
              stroke: color,
              strokeWidth,
              strokeLinecap: 'round',
              strokeLinejoin: 'round',
            }

            let head
            switch (type) {
              case 'triangle':
                head = <polygon points={`0,0 ${-length},${-half} ${-length},${half}`} fill={color} stroke={color} />
                break
              case 'inverted':
                head = <polygon points={`${-length},0 0,${-half} 0,${half}`} fill={color} stroke={color} />
                break
              case 'dot':
                head = <circle cx={-half * 0.3} cy={0} r={half * 0.72} fill={color} stroke={color} />
                break
              case 'diamond':
                head = <polygon points={`0,0 ${-length * 0.5},${-half} ${-length},0 ${-length * 0.5},${half}`} fill={color} stroke={color} />
                break
              case 'square':
                head = <rect x={-half * 2} y={-half} width={half * 2} height={half * 2} rx={1} fill={color} stroke={color} />
                break
              case 'bar':
              case 'pipe':
                head = <line x1={-strokeWidth} y1={-half} x2={-strokeWidth} y2={half} {...common} />
                break
              case 'arrow':
              default:
                head = <path d={`M ${-length} ${-half} L 0 0 L ${-length} ${half}`} fill="none" {...common} />
                break
            }

            return <g transform={`translate(${point.x} ${point.y}) rotate(${angle})`}>{head}</g>
          }

          function ConnectorDrawing({ shape, theme }) {
            const points = connectorPoints(shape)
            if (points.length < 2) return null
            const path = getConnectorPath(shape)
            const strokeWidth = STROKE_SIZES[shape.props.size] * (shape.props.scale || 1)
            const color = getColorValue(theme, shape.props.color, 'solid')
            const body = path.toSvg({
              style: shape.props.dash,
              strokeWidth,
              randomSeed: shape.id,
              props: { stroke: color, fill: 'none' },
            })

            const start = points[0]
            const startNeighbor = points[1]
            const end = points[points.length - 1]
            const endNeighbor = points[points.length - 2]

            return (
              <>
                {body}
                <Arrowhead type={shape.props.arrowheadStart} point={start} neighbor={startNeighbor} color={color} strokeWidth={strokeWidth} />
                <Arrowhead type={shape.props.arrowheadEnd} point={end} neighbor={endNeighbor} color={color} strokeWidth={strokeWidth} />
              </>
            )
          }

          function StationConnectorComponent({ shape }) {
            const theme = useDefaultColorTheme()
            return (
              <SVGContainer style={{ minWidth: 32, minHeight: 32 }}>
                <ConnectorDrawing shape={shape} theme={theme} />
              </SVGContainer>
            )
          }

          // Deliberately inherit tldraw's LineShapeUtil. Its point map, create
          // handles, drag lifecycle, snapping, and midpoint insertion are the
          // native implementation we were unsuccessfully trying to reproduce.
          // Station 8 only adds arrowhead props and rendering.
          export class StationConnectorShapeUtil extends LineShapeUtil {
            static type = STATION_CONNECTOR_TYPE
            static props = {
              ...LineShapeUtil.props,
              arrowheadStart: ArrowShapeArrowheadStartStyle,
              arrowheadEnd: ArrowShapeArrowheadEndStyle,
            }

            getDefaultProps() {
              return {
                ...super.getDefaultProps(),
                spline: 'cubic',
                arrowheadStart: 'none',
                arrowheadEnd: 'arrow',
              }
            }

            canEdit() {
              return true
            }

            component(shape) {
              return <StationConnectorComponent shape={shape} />
            }

            indicator(shape) {
              return <path d={getConnectorPath(shape).toD()} fill="none" />
            }

            toSvg(shape, ctx) {
              return (
                <g>
                  <ConnectorDrawing shape={shape} theme={getDefaultColorTheme(ctx)} />
                </g>
              )
            }
          }
          '''
          Path('frontend/src/canvas/StationConnectorShapeUtil.jsx').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in shape.splitlines()) + '\n')

          tool = r'''import { StateNode, Vec, createShapeId, getIndices } from 'tldraw'
          import { STATION_CONNECTOR_TYPE } from './StationConnectorShapeUtil'

          export const STATION_CONNECTOR_TOOL = 's8-connector'

          export class StationConnectorTool extends StateNode {
            static id = STATION_CONNECTOR_TOOL

            shapeId = null
            startPoint = null
            startIndex = null
            endIndex = null

            onEnter() {
              this.editor.setCursor({ type: 'cross', rotation: 0 })
            }

            onPointerDown() {
              const point = this.editor.inputs.getCurrentPagePoint()
              const id = createShapeId()
              const [startIndex, endIndex] = getIndices(2)

              this.editor.markHistoryStoppingPoint('create connector')
              this.editor.createShape({
                id,
                type: STATION_CONNECTOR_TYPE,
                x: point.x,
                y: point.y,
                props: {
                  spline: 'cubic',
                  scale: 1,
                  points: {
                    [startIndex]: { id: startIndex, index: startIndex, x: 0, y: 0 },
                    [endIndex]: { id: endIndex, index: endIndex, x: 0, y: 0 },
                  },
                },
              })

              this.shapeId = id
              this.startPoint = new Vec(point.x, point.y)
              this.startIndex = startIndex
              this.endIndex = endIndex
              this.editor.select(id)
            }

            onPointerMove() {
              if (!this.shapeId || !this.startPoint || !this.endIndex) return
              const current = this.editor.inputs.getCurrentPagePoint()
              const shape = this.editor.getShape(this.shapeId)
              if (!shape) return
              this.editor.updateShape({
                id: this.shapeId,
                type: STATION_CONNECTOR_TYPE,
                props: {
                  points: {
                    ...shape.props.points,
                    [this.endIndex]: {
                      id: this.endIndex,
                      index: this.endIndex,
                      x: current.x - this.startPoint.x,
                      y: current.y - this.startPoint.y,
                    },
                  },
                },
              })
            }

            onPointerUp() {
              if (!this.shapeId || !this.startPoint) return
              const current = this.editor.inputs.getCurrentPagePoint()
              const distance = Vec.Dist(this.startPoint, current)
              const id = this.shapeId

              this.clearDraftState()
              if (distance < 4 / this.editor.getZoomLevel()) {
                this.editor.deleteShapes([id])
              } else {
                this.editor.select(id)
              }
              this.editor.setCurrentTool('select')
            }

            onCancel() {
              this.discardDraft()
              this.editor.setCurrentTool('select')
            }

            onInterrupt() {
              this.discardDraft()
            }

            onExit() {
              this.discardDraft()
            }

            clearDraftState() {
              this.shapeId = null
              this.startPoint = null
              this.startIndex = null
              this.endIndex = null
            }

            discardDraft() {
              if (this.shapeId) this.editor.deleteShapes([this.shapeId])
              this.clearDraftState()
            }
          }
          '''
          Path('frontend/src/canvas/StationConnectorTool.js').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in tool.splitlines()) + '\n')

          legacy = r'''import { getIndices } from 'tldraw'

          function richTextPlainText(node) {
            if (!node || typeof node !== 'object') return ''
            if (node.type === 'text') return String(node.text || '')
            return (node.content || []).map(richTextPlainText).join('')
          }

          function isSimpleLegacyArrow(shape) {
            const props = shape?.props || {}
            if (shape?.typeName !== 'shape' || shape?.type !== 'arrow') return false
            if (props.kind && props.kind !== 'arc') return false
            if (Math.abs(Number(props.scale || 1) - 1) > 0.0001) return false
            if (richTextPlainText(props.richText).trim()) return false
            return true
          }

          export function connectorPointMap(points) {
            const normalized = (points || [])
              .filter(point => point && Number.isFinite(point.x) && Number.isFinite(point.y))
              .map(point => ({ x: Number(point.x), y: Number(point.y) }))
            if (normalized.length < 2) return null
            const ids = getIndices(normalized.length)
            return Object.fromEntries(normalized.map((point, index) => {
              const id = ids[index]
              return [id, { id, index: id, x: point.x, y: point.y }]
            }))
          }

          export function migrateStoredStationConnectors(snapshot) {
            const store = snapshot?.store
            if (!store || typeof store !== 'object') return snapshot
            let changed = false
            const nextStore = { ...store }
            for (const [key, record] of Object.entries(store)) {
              if (record?.typeName !== 'shape' || record?.type !== 's8-connector') continue
              if (!Array.isArray(record.props?.points)) continue
              const points = connectorPointMap(record.props.points)
              if (!points) continue
              nextStore[key] = {
                ...record,
                props: {
                  ...record.props,
                  points,
                  spline: record.props?.spline || 'cubic',
                  scale: Number.isFinite(record.props?.scale) ? record.props.scale : 1,
                },
              }
              changed = true
            }
            return changed ? { ...snapshot, store: nextStore } : snapshot
          }

          export function connectorPointsFromArrowInfo(info) {
            if (!info || !info.start?.point || !info.end?.point || info.type === 'elbow') return null
            const points = info.type === 'arc'
              ? [info.start.point, info.middle, info.end.point]
              : [info.start.point, info.end.point]
            if (points.some(point => !point || !Number.isFinite(point.x) || !Number.isFinite(point.y))) return null
            return points.map(point => ({ x: Number(point.x), y: Number(point.y) }))
          }

          // Upgrade after the native snapshot is loaded so tldraw resolves any
          // endpoint bindings first. The replacement then uses tldraw's native
          // Line point-map representation, which gives it native midpoint drag
          // behavior immediately.
          export function upgradeLoadedLegacyConnectors(editor, { getArrowInfo, createShapeId }) {
            if (!editor || typeof getArrowInfo !== 'function' || typeof createShapeId !== 'function') return 0
            const arrows = editor.getCurrentPageShapes().filter(isSimpleLegacyArrow)
            let upgraded = 0

            for (const arrow of arrows) {
              let info
              try {
                info = getArrowInfo(editor, arrow)
              } catch {
                continue
              }
              const rawPoints = connectorPointsFromArrowInfo(info)
              const points = connectorPointMap(rawPoints)
              if (!points) continue

              const replacement = {
                id: createShapeId(),
                type: 's8-connector',
                x: arrow.x,
                y: arrow.y,
                rotation: arrow.rotation,
                parentId: arrow.parentId,
                index: arrow.index,
                opacity: arrow.opacity,
                isLocked: arrow.isLocked,
                meta: {
                  ...(arrow.meta || {}),
                  upgradedFromNativeConnector: true,
                  legacyConnectorId: arrow.id,
                },
                props: {
                  points,
                  spline: 'cubic',
                  scale: 1,
                  color: arrow.props?.color || 'black',
                  dash: arrow.props?.dash || 'draw',
                  size: arrow.props?.size || 'm',
                  arrowheadStart: arrow.props?.arrowheadStart || 'none',
                  arrowheadEnd: arrow.props?.arrowheadEnd || 'arrow',
                },
              }

              editor.deleteShapes([arrow.id])
              editor.createShape(replacement)
              upgraded += 1
            }

            return upgraded
          }
          '''
          Path('frontend/src/canvas/legacyConnectorUpgrade.js').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in legacy.splitlines()) + '\n')

          # TldrawCanvas: pre-migrate stored Station connector data to the
          # native Line point map, then intercept Station document drops before
          # tldraw's own external-file handler can emit "File type is not allowed".
          canvas_path = Path('frontend/src/TldrawCanvas.jsx')
          canvas = canvas_path.read_text()
          canvas = canvas.replace(
            "import { upgradeLoadedLegacyConnectors } from './canvas/legacyConnectorUpgrade'",
            "import { migrateStoredStationConnectors, upgradeLoadedLegacyConnectors } from './canvas/legacyConnectorUpgrade'",
            1,
          )
          old_sig = "export default function TldrawCanvas({ boardId, readOnly, viewerMode, onSaveState, colorMode, findQuery, onFindDismiss, findBoards, onNavigateBoard, findShapeIds }) {"
          new_sig = "export default function TldrawCanvas({ boardId, readOnly, viewerMode, onSaveState, colorMode, findQuery, onFindDismiss, findBoards, onNavigateBoard, findShapeIds, onExternalFilesDrop }) {"
          if old_sig not in canvas:
            raise SystemExit('TldrawCanvas signature anchor missing')
          canvas = canvas.replace(old_sig, new_sig, 1)

          old_load = "          editor.store.loadStoreSnapshot(data.snapshot)\n          upgradeLoadedLegacyConnectors(editor, { getArrowInfo, createShapeId })"
          new_load = "          editor.store.loadStoreSnapshot(migrateStoredStationConnectors(data.snapshot))\n          upgradeLoadedLegacyConnectors(editor, { getArrowInfo, createShapeId })"
          if old_load not in canvas:
            raise SystemExit('TldrawCanvas snapshot-load anchor missing')
          canvas = canvas.replace(old_load, new_load, 1)

          insert_anchor = "  const ghostPx = ghost && editorRef.current\n"
          drop_handlers = r'''  const handleDocumentDropCapture = useCallback((event) => {
            if (readOnlyRef.current || typeof onExternalFilesDrop !== 'function') return
            const files = Array.from(event.dataTransfer?.files || [])
            const stationFiles = files.filter(file => /\.(?:pdf|docx|pptx)$/i.test(String(file?.name || '')))
            if (!stationFiles.length) return

            // Capture before tldraw's default external-file handler. Otherwise
            // valid Office files produce its generic "File type is not allowed"
            // toast even though Station 8 is about to import them successfully.
            event.preventDefault()
            event.stopPropagation()
            void onExternalFilesDrop(stationFiles)
          }, [onExternalFilesDrop])

'''
          if insert_anchor not in canvas:
            raise SystemExit('TldrawCanvas drop-handler insertion anchor missing')
          canvas = canvas.replace(insert_anchor, drop_handlers + insert_anchor, 1)

          wrapper_anchor = "      onWheelCapture={handleWheelCapture}\n"
          if wrapper_anchor not in canvas:
            raise SystemExit('TldrawCanvas wrapper anchor missing')
          canvas = canvas.replace(wrapper_anchor, wrapper_anchor + "      onDropCapture={handleDocumentDropCapture}\n", 1)
          canvas_path.write_text(canvas)

          # App: canvas drops go into the currently open board's Station folder.
          app_path = Path('frontend/src/App.jsx')
          app = app_path.read_text()
          anchor = "                    onNavigateBoard={(boardId) => {\n"
          addition = "                    onExternalFilesDrop={(files) => uploadDroppedFiles(files, activeDoc?.folder_id || null)}\n"
          if anchor not in app:
            raise SystemExit('App TldrawCanvas prop anchor missing')
          if addition not in app:
            app = app.replace(anchor, addition + anchor, 1)
          app_path.write_text(app)

          # Tests: assert we have stopped owning the handle lifecycle entirely.
          Path('frontend/src/canvas/StationConnectorShapeUtil.test.js').write_text(r'''import test from 'node:test'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'

          const source = readFileSync(new URL('./StationConnectorShapeUtil.jsx', import.meta.url), 'utf8')

          test('Station Connector inherits tldraw native Line midpoint interaction', () => {
            assert.match(source, /extends LineShapeUtil/)
            assert.match(source, /\.\.\.LineShapeUtil\.props/)
            assert.doesNotMatch(source, /onHandleDragStart\s*\(/)
            assert.doesNotMatch(source, /onHandleDrag\s*\(/)
          })
          '''.replace(/^          /gm, ''))

          Path('frontend/src/canvas/legacyConnectorUpgrade.test.js').write_text(r'''import test from 'node:test'
          import assert from 'node:assert/strict'
          import {
            connectorPointMap,
            connectorPointsFromArrowInfo,
            migrateStoredStationConnectors,
          } from './legacyConnectorUpgrade.js'

          test('connectorPointMap uses stable indexed tldraw Line points', () => {
            const mapped = connectorPointMap([{ x: 0, y: 0 }, { x: 50, y: 20 }, { x: 100, y: 0 }])
            const points = Object.values(mapped)
            assert.equal(points.length, 3)
            for (const point of points) {
              assert.equal(point.id, point.index)
              assert.equal(typeof point.index, 'string')
            }
          })

          test('stored array-based Station connectors migrate before tldraw validates them', () => {
            const snapshot = { store: {
              'shape:one': {
                typeName: 'shape', id: 'shape:one', type: 's8-connector',
                props: { points: [{ x: 0, y: 0 }, { x: 100, y: 0 }], color: 'black', dash: 'draw', size: 'm' },
              },
            } }
            const migrated = migrateStoredStationConnectors(snapshot)
            const props = migrated.store['shape:one'].props
            assert.equal(Array.isArray(props.points), false)
            assert.equal(Object.keys(props.points).length, 2)
            assert.equal(props.spline, 'cubic')
            assert.equal(props.scale, 1)
          })

          test('native arrow geometry converts to connector points', () => {
            assert.deepEqual(
              connectorPointsFromArrowInfo({
                type: 'arc', start: { point: { x: 0, y: 0 } }, middle: { x: 50, y: 30 }, end: { point: { x: 100, y: 0 } },
              }),
              [{ x: 0, y: 0 }, { x: 50, y: 30 }, { x: 100, y: 0 }],
            )
          })
          '''.replace(/^          /gm, ''))

          Path('frontend/src/canvas/documentDropRouting.test.js').write_text(r'''import test from 'node:test'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'

          const canvas = readFileSync(new URL('../TldrawCanvas.jsx', import.meta.url), 'utf8')
          const app = readFileSync(new URL('../App.jsx', import.meta.url), 'utf8')

          test('canvas captures Station document drops before tldraw external-file handling', () => {
            assert.match(canvas, /onDropCapture=\{handleDocumentDropCapture\}/)
            assert.match(canvas, /pdf\|docx\|pptx/)
            assert.match(canvas, /event\.stopPropagation\(\)/)
          })

          test('canvas document drops use the current board folder and existing shared queue', () => {
            assert.match(app, /onExternalFilesDrop=\{\(files\) => uploadDroppedFiles\(files, activeDoc\?\.folder_id \|\| null\)\}/)
          })
          '''.replace(/^          /gm, ''))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Commit verified source
        shell: bash
        run: |
          rm -f .github/workflows/native-line-connector-canvas-drop-fix.yml
          git config user.name "Station 8 Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: use native line handles and capture document drops"
          git push origin HEAD:fix/native-line-connector-canvas-office-drop

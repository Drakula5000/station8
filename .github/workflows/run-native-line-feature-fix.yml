name: Run native connector feature fix

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'fix/native-line-connector-canvas-office-drop' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-line-connector-canvas-office-drop
          fetch-depth: 0

      - name: Execute staged source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          raw = Path('.github/workflows/native-line-connector-canvas-drop-fix.yml').read_text()
          start = "      - name: Replace connector with native Line handle system and route canvas document drops\n        shell: bash\n        run: |\n"
          end = "\n      - uses: actions/setup-node@v4"
          if start not in raw or end not in raw:
              raise SystemExit('staged source-patch anchors missing')
          script = textwrap.dedent(raw.split(start, 1)[1].split(end, 1)[0])
          Path('/tmp/station8-native-line-fix.sh').write_text(script)
          PY
          bash /tmp/station8-native-line-fix.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Commit verified source
        shell: bash
        run: |
          rm -f .github/workflows/native-line-connector-canvas-drop-fix.yml
          rm -f _trigger_native_line_fix*.txt
          git config user.name "Station 8 Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: use native line handles and capture canvas document drops"
          git push origin HEAD:fix/native-line-connector-canvas-office-drop

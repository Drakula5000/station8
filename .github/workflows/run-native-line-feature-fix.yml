name: Run native connector feature fix

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'fix/native-line-connector-canvas-office-drop' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-line-connector-canvas-office-drop
          fetch-depth: 0

      - name: Patch canvas document routing and stored connector migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          canvas_path = Path('frontend/src/TldrawCanvas.jsx')
          canvas = canvas_path.read_text()

          old_import = "import { upgradeLoadedLegacyConnectors } from './canvas/legacyConnectorUpgrade'"
          new_import = "import { migrateStoredStationConnectors, upgradeLoadedLegacyConnectors } from './canvas/legacyConnectorUpgrade'"
          if old_import in canvas:
              canvas = canvas.replace(old_import, new_import, 1)
          elif new_import not in canvas:
              raise SystemExit('legacy connector import anchor missing')

          old_sig = "export default function TldrawCanvas({ boardId, readOnly, viewerMode, onSaveState, colorMode, findQuery, onFindDismiss, findBoards, onNavigateBoard, findShapeIds }) {"
          new_sig = "export default function TldrawCanvas({ boardId, readOnly, viewerMode, onSaveState, colorMode, findQuery, onFindDismiss, findBoards, onNavigateBoard, findShapeIds, onExternalFilesDrop }) {"
          if old_sig in canvas:
              canvas = canvas.replace(old_sig, new_sig, 1)
          elif new_sig not in canvas:
              raise SystemExit('TldrawCanvas signature anchor missing')

          old_ref = "  const onSaveStateRef = useRef(onSaveState)\n"
          new_ref = "  const onSaveStateRef = useRef(onSaveState)\n  const onExternalFilesDropRef = useRef(onExternalFilesDrop)\n"
          if 'const onExternalFilesDropRef = useRef' not in canvas:
              if old_ref not in canvas:
                  raise SystemExit('external drop ref anchor missing')
              canvas = canvas.replace(old_ref, new_ref, 1)

          old_effect = "    onSaveStateRef.current = onSaveState\n  }, [boardId, readOnly, viewerMode, onSaveState])"
          new_effect = "    onSaveStateRef.current = onSaveState\n    onExternalFilesDropRef.current = onExternalFilesDrop\n  }, [boardId, readOnly, viewerMode, onSaveState, onExternalFilesDrop])"
          if old_effect in canvas:
              canvas = canvas.replace(old_effect, new_effect, 1)
          elif new_effect not in canvas:
              raise SystemExit('external drop ref sync anchor missing')

          old_load = "          editor.store.loadStoreSnapshot(data.snapshot)\n          upgradeLoadedLegacyConnectors(editor, { getArrowInfo, createShapeId })"
          new_load = "          editor.store.loadStoreSnapshot(migrateStoredStationConnectors(data.snapshot))\n          upgradeLoadedLegacyConnectors(editor, { getArrowInfo, createShapeId })"
          if old_load in canvas:
              canvas = canvas.replace(old_load, new_load, 1)
          elif new_load not in canvas:
              raise SystemExit('snapshot migration anchor missing')

          old_handler = """      const mediaFiles = files.filter((file) => file.type.startsWith('image/') || file.type.startsWith('video/'))
      const otherFiles = files.filter((file) => !file.type.startsWith('image/') && !file.type.startsWith('video/'))

      if (mediaFiles.length && defaultFilesHandler) {
        const originalZoomToSelection = editor.zoomToSelection
        editor.zoomToSelection = () => editor
        try {
          await defaultFilesHandler({ ...externalContent, files: mediaFiles, point })
        } finally {
          editor.zoomToSelection = originalZoomToSelection
        }
      }

      if (otherFiles.length && defaultFilesHandler) {
        await defaultFilesHandler({ ...externalContent, files: otherFiles })
      }
"""
          new_handler = """      const stationFiles = files.filter(file => /\\.(?:pdf|docx|pptx)$/i.test(String(file?.name || '')))
      const mediaFiles = files.filter((file) => file.type.startsWith('image/') || file.type.startsWith('video/'))
      const otherFiles = files.filter((file) => (
        !stationFiles.includes(file)
        && !file.type.startsWith('image/')
        && !file.type.startsWith('video/')
      ))

      // Intercept Station 8 document types here, inside tldraw's registered
      // file pipeline. Supported DOCX/PPTX/PDF files never reach tldraw's
      // generic file validator, so it cannot emit "File type is not allowed".
      if (stationFiles.length && !readOnlyRef.current && typeof onExternalFilesDropRef.current === 'function') {
        await onExternalFilesDropRef.current(stationFiles)
      }

      if (mediaFiles.length && defaultFilesHandler) {
        const originalZoomToSelection = editor.zoomToSelection
        editor.zoomToSelection = () => editor
        try {
          await defaultFilesHandler({ ...externalContent, files: mediaFiles, point })
        } finally {
          editor.zoomToSelection = originalZoomToSelection
        }
      }

      if (otherFiles.length && defaultFilesHandler) {
        await defaultFilesHandler({ ...externalContent, files: otherFiles })
      }
"""
          if old_handler in canvas:
              canvas = canvas.replace(old_handler, new_handler, 1)
          elif 'const stationFiles = files.filter' not in canvas:
              raise SystemExit('tldraw external files handler anchor missing')

          capture_start = canvas.find('  const handleDocumentDropCapture = useCallback((event) => {')
          if capture_start >= 0:
              capture_end = canvas.find('\n  const ghostPx = ghost && editorRef.current', capture_start)
              if capture_end < 0:
                  raise SystemExit('capture handler removal anchor missing')
              canvas = canvas[:capture_start] + canvas[capture_end + 1:]
          canvas = canvas.replace('      onDropCapture={handleDocumentDropCapture}\n', '')

          canvas_path.write_text(canvas)

          app_path = Path('frontend/src/App.jsx')
          app = app_path.read_text()
          nav_anchor = "                    onNavigateBoard={(boardId) => {\n"
          drop_prop = "                    onExternalFilesDrop={(files) => uploadDroppedFiles(files, activeDoc?.folder_id || null)}\n"
          if drop_prop not in app:
              if nav_anchor not in app:
                  raise SystemExit('App board canvas prop anchor missing')
              app = app.replace(nav_anchor, drop_prop + nav_anchor, 1)
          app_path.write_text(app)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Commit verified source
        shell: bash
        run: |
          rm -f .github/workflows/native-line-connector-canvas-drop-fix.yml
          rm -f _trigger_native_line_fix*.txt
          git config user.name "Station 8 Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Feature source already patched."
            exit 0
          fi
          git commit -m "fix: route Station documents inside tldraw file handler"
          git push origin HEAD:fix/native-line-connector-canvas-office-drop

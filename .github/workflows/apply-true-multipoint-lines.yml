name: Apply true multipoint line behavior

on:
  pull_request:
    branches: [main]
    paths:
      - frontend/src/TldrawCanvas.jsx
      - frontend/src/components/ShapeInspector.jsx
      - frontend/src/canvas/StationLineShapeUtil.js
      - frontend/src/canvas/StationLineShapeUtil.test.js
      - .github/workflows/apply-true-multipoint-lines.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply real multipoint line behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/components/ShapeInspector.jsx')
          text = path.read_text()
          blocks = [
          """const LINE_SPLINE_OPTIONS = [\n  { id: 'line', label: 'Straight', title: 'Straight segments' },\n  { id: 'cubic', label: 'Curve', title: 'Smooth curve through every line point' },\n]\n\n""",
          """const SHAPES_WITH_LINE_SPLINE = new Set(['line'])\n""",
          """  const showLineSpline = allShapesMatch(shapes, SHAPES_WITH_LINE_SPLINE)\n""",
          """    || showLineSpline\n""",
          """  const activeLineSpline = showLineSpline && shapes.every(\n    (shape) => shape.props?.spline === shapes[0].props?.spline\n  ) ? shapes[0].props?.spline : undefined\n""",
          """  const applyLineSpline = (id) => editor.updateShapes(\n    shapes.map((shape) => ({ id: shape.id, type: shape.type, props: { spline: id } }))\n  )\n""",
          """      {showLineSpline && (\n        <div className=\"insp-row\">\n          <div className=\"insp-label\">Path</div>\n          <div className=\"insp-body\">\n            {LINE_SPLINE_OPTIONS.map((option) => (\n              <button\n                key={option.id}\n                className={`insp-btn ${activeLineSpline === option.id ? 'active' : ''}`}\n                onClick={() => applyLineSpline(option.id)}\n                title={option.title}\n                type=\"button\"\n              >{option.label}</button>\n            ))}\n          </div>\n        </div>\n      )}\n\n""",
          ]
          for block in blocks:
              if block not in text:
                  raise SystemExit('Expected previous line-spline block not found:\n' + block[:120])
              text = text.replace(block, '', 1)
          path.write_text(text)

          path = Path('frontend/src/TldrawCanvas.jsx')
          text = path.read_text()
          old = "import { StationFrameShapeUtil } from './canvas/StationFrameShapeUtil'\nimport { StationNoteShapeUtil } from './canvas/StationNoteShapeUtil'"
          new = "import { StationFrameShapeUtil } from './canvas/StationFrameShapeUtil'\nimport { StationLineShapeUtil } from './canvas/StationLineShapeUtil'\nimport { StationNoteShapeUtil } from './canvas/StationNoteShapeUtil'"
          if text.count(old) != 1:
              raise SystemExit('Station util import anchor mismatch')
          text = text.replace(old, new, 1)
          old = "  StationFrameShapeUtil,\n  StationNoteShapeUtil,"
          new = "  StationFrameShapeUtil,\n  StationLineShapeUtil,\n  StationNoteShapeUtil,"
          if text.count(old) != 1:
              raise SystemExit('Station shape util array anchor mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text)

          Path('frontend/src/canvas/StationLineShapeUtil.js').write_text("""import { LineShapeUtil } from 'tldraw'\n\n// tldraw Line already provides an unlimited sequence of draggable vertices:\n// every segment has a midpoint create handle, and dragging it inserts another\n// vertex. Station hides tldraw's style panel, though, so stock lines stay\n// polygonal unless the hidden spline setting is changed. Make that interaction\n// directly match Station's UX: new lines are smooth, and dragging any midpoint\n// on an older straight line automatically turns it into a cubic spline.\nexport class StationLineShapeUtil extends LineShapeUtil {\n  getDefaultProps() {\n    return { ...super.getDefaultProps(), spline: 'cubic' }\n  }\n\n  onHandleDragStart(shape, info) {\n    const next = super.onHandleDragStart(shape, info)\n    if (info.handle.type !== 'create') return next\n    if (!next) return next\n    return {\n      ...next,\n      props: { ...next.props, spline: 'cubic' },\n    }\n  }\n}\n""")

          Path('frontend/src/canvas/StationLineShapeUtil.test.js').write_text("""import test from 'node:test'\nimport assert from 'node:assert/strict'\nimport { readFileSync } from 'node:fs'\n\nconst source = readFileSync(new URL('./StationLineShapeUtil.js', import.meta.url), 'utf8')\n\ntest('Station lines use unlimited native points as smooth curve controls', () => {\n  assert.match(source, /extends LineShapeUtil/)\n  assert.match(source, /getDefaultProps\\(\\).*spline: 'cubic'/s)\n  assert.match(source, /handle\\.type !== 'create'/)\n  assert.match(source, /props: \\{ \\.\\.\\.next\\.props, spline: 'cubic' \\}/)\n})\n""")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Unit tests
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Commit verified fix
        shell: bash
        run: |
          rm .github/workflows/apply-true-multipoint-lines.yml
          git config user.name "Station 8 Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/TldrawCanvas.jsx frontend/src/components/ShapeInspector.jsx frontend/src/canvas/StationLineShapeUtil.js frontend/src/canvas/StationLineShapeUtil.test.js .github/workflows
          git commit -m "fix(canvas): enable true multipoint curved lines"
          git push origin HEAD:${{ github.head_ref }}

name: Materialize Office Connector Feature

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'fix/office-drop-and-connector-ux' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/office-drop-and-connector-ux
          fetch-depth: 0

      - name: Materialize or repair feature source
        shell: bash
        run: |
          if [ -f .github/workflows/apply-office-drop-connector-ux.yml ]; then
            python - <<'PY'
          from pathlib import Path
          import textwrap

          raw = Path('.github/workflows/apply-office-drop-connector-ux.yml').read_text()
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          if start not in raw or end not in raw:
              raise SystemExit('could not locate staged source patch')
          body = raw.split(start, 1)[1].split(end, 1)[0]
          exec(compile(textwrap.dedent(body), 'office-connector-feature-patch', 'exec'), {})
          PY
          fi

          python - <<'PY'
          from pathlib import Path

          server_path = Path('server.py')
          text = server_path.read_text()
          start_anchor = "    boundary = f'station8-{uuid.uuid4().hex}'\n"
          end_anchor = "    body = prefix + blob + suffix\n"
          start = text.find(start_anchor, text.find('def _drive_import_office_file'))
          end = text.find(end_anchor, start)
          if start < 0 or end < 0:
              raise SystemExit('Office multipart anchors missing')
          end += len(end_anchor)
          replacement = r'''    boundary = f'station8-{uuid.uuid4().hex}'
    prefix = (
        f'--{boundary}\r\n'
        'Content-Type: application/json; charset=UTF-8\r\n\r\n'
        f'{json.dumps(metadata)}\r\n'
        f'--{boundary}\r\n'
        f'Content-Type: {source_mime}\r\n\r\n'
    ).encode('utf-8')
    suffix = f'\r\n--{boundary}--\r\n'.encode('utf-8')
    body = prefix + blob + suffix
'''
          text = text[:start] + replacement + text[end:]
          broken_docstring = r'    \"\"\"Upload an OOXML file and ask Drive to convert it to a Google-native type.\"\"\"'
          text = text.replace(
              broken_docstring,
              '    """Upload an OOXML file and ask Drive to convert it to a Google-native type."""',
              1,
          )
          server_path.write_text(text)

          test_path = Path('tests/test_office_import.py')
          test_text = test_path.read_text()
          marker = "\n\nif __name__ == '__main__':\n"
          test_name = 'test_drive_office_import_uses_crlf_multipart_body'
          if test_name not in test_text:
              if marker not in test_text:
                  raise SystemExit('Office import test insertion anchor missing')
              test_method = r'''
    def test_drive_office_import_uses_crlf_multipart_body(self):
        captured = {}

        class FakeResponse:
            def __enter__(self):
                return self

            def __exit__(self, exc_type, exc, tb):
                return False

            def read(self):
                return b'{"id":"doc-id"}'

        def fake_urlopen(request, timeout=30):
            captured['body'] = request.data
            captured['content_type'] = request.get_header('Content-type')
            return FakeResponse()

        with patch.object(server._urllib_request, 'urlopen', side_effect=fake_urlopen):
            file_id, url = server._drive_import_office_file(
                'Exercises.docx',
                b'PK\x03\x04office-data',
                'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
                'gdoc',
                parent_id='drive-folder',
                access_token='token',
            )

        self.assertEqual(file_id, 'doc-id')
        self.assertEqual(url, 'https://docs.google.com/document/d/doc-id/edit')
        content_type = captured['content_type']
        self.assertTrue(content_type.startswith('multipart/related; boundary='))
        boundary = content_type.split('boundary=', 1)[1]
        body = captured['body']
        self.assertTrue(body.startswith(f'--{boundary}\r\n'.encode()))
        self.assertIn(b'Content-Type: application/json; charset=UTF-8\r\n\r\n', body)
        self.assertIn(
            b'Content-Type: application/vnd.openxmlformats-officedocument.wordprocessingml.document\r\n\r\nPK\x03\x04office-data',
            body,
        )
        self.assertTrue(body.endswith(f'\r\n--{boundary}--\r\n'.encode()))
'''
              test_text = test_text.replace(marker, test_method + marker, 1)
              test_path.write_text(test_text)
          PY

          rm -f .github/workflows/apply-office-drop-connector-ux.yml
          rm -f .github/workflows/run-staged-office-patch.yml
          rm -f _agent_trigger*.txt

          git config user.name "Station 8 Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Feature source already repaired."
            exit 0
          fi
          git commit -m "fix: emit valid Drive multipart Office imports"
          git push origin HEAD:fix/office-drop-and-connector-ux

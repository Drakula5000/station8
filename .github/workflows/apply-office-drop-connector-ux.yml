      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Frontend lint
        run: npm run lint
        working-directory: frontend
      - name: Frontend tests
        run: npm test
        working-directory: frontend
      - name: Frontend build
        run: npm run build
        working-directory: frontend

      - name: Install backend
        run: pip install -r requirements.txt
      - name: Backend import check
        env:
          FLASK_SECRET_KEY: ci-dummy
        run: python -c "import server"
      - name: Backend tests
        env:
          FLASK_SECRET_KEY: ci-dummy
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Verify safety invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          canvas = Path('frontend/src/TldrawCanvas.jsx').read_text()
          connector = Path('frontend/src/canvas/StationConnectorShapeUtil.jsx').read_text()
          server = Path('server.py').read_text()
          app = Path('frontend/src/App.jsx').read_text()
          assert 'loadingRef.current' in canvas
          assert 'if (!loadSucceeded) return' in canvas
          assert 'upgradeLegacyConnectors(data.snapshot)' in canvas
          assert 'connectorPointIds' in connector
          assert 'getIndexBetween' in connector
          assert '/api/google/import-office' in server
          assert "'gslide': 'application/vnd.google-apps.presentation'" in server
          assert 'uploadDroppedFiles' in app
          assert 'uploadDroppedPdfs' not in app
          PY

      - name: Commit verified implementation
        shell: bash
        run: |
          rm .github/workflows/apply-office-drop-connector-ux.yml
          git config user.name "Station 8 Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Office drops and finish multipoint connectors"
          git push origin HEAD:fix/office-drop-and-connector-ux
